name: CI 
on: 
  push: 
    branches: [master] 
  pull_request: 
    branches: [master] 
jobs: 
  build: 
    runs-on: ubuntu-latest 
    steps: 
      - name: Checkout repository 
        uses: actions/checkout@v4
      - name: Cache files 
        uses: actions/cache@v4
        with: 
            path: | 
                ~/.sonar 
            key: ${{ runner.os }}-sonar 
            restore-keys: ${{ runner.os }}-sonar
      - name: Run Codescan On Push 
        if: github.event_name == 'push' 
        uses: codescan-io/codescan-scanner-action@1.6
        with: 
          codeScanUrl: https://test.codescan.io/
          organization: test-nitesh
          projectKey: test-git-master
          login: squ_8bc43395775b0bf257a04aa052d1ad912b352847
          failOnRedQualityGate: false 
          generateSarifFile: true
          args: | 
            sonar.java.binaries=.
      - name: Run Codescan On PR 
        if: github.event_name == 'pull_request' 
        uses: codescan-io/codescan-scanner-action@prerelease-test
        with: 
          codeScanUrl: https://preview.codescan.io
          organization: nkar
          projectKey: test-git-1
          login: squ_6e202e8f5c86bc80dff610ad292677b55169b95e
          scanChangedFilesOnly: true 
          failOnRedQualityGate: false
          args: | 
            sonar.pullrequest.branch=${{github.head_ref}} 
            sonar.pullrequest.base=${{github.base_ref}} 
            sonar.pullrequest.key=${{github.event.number}} 
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
            name: codescan.sarif
            path: codescan.sarif 
 
