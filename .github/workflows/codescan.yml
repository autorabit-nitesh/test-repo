name: CI
env:
    SONAR_SCANNER_VERSION: 7.2
on:
  push:
    branches:
      - 'dev'
    paths-ignore:
      - src/**
      - target/**
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - src/**
      - target/**
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # or the version you need
      - name: Cache files
        uses: actions/cache@v4
        with:
            path: |
                ~/.sonar
            key: ${{ runner.os }}-sonar
            restore-keys: ${{ runner.os }}-sonar
      - name: Run Codescan On Push
        if: github.event_name == 'push'
        uses: codescan-io/codescan-scanner-action@1.6
        with:
          scanChangedFilesOnly: true
          organization: severity
          projectKey: github-actions-sarif
          codeScanUrl: https://preview.codescan.io/
          login: squ_7087cb118003e07e0db7c964529fa004db5427fc
          generateSarifFile: true
      - name: Run Codescan On PR
        if: github.event_name == 'pull_request'
        uses: codescan-io/codescan-scanner-action@2.0
        with:
          scanChangedFilesOnly: true
          organization: severity
          projectKey: github-actions-sarif
          codeScanUrl: https://preview.codescan.io/
          login: squ_7087cb118003e07e0db7c964529fa004db5427fc
          generateSarifFile: true
          args: |
            sonar.pullrequest.branch=${{github.head_ref}}
            sonar.pullrequest.base=${{github.base_ref}}
            sonar.pullrequest.key=${{github.event.number}}
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: codescan.sarif
          path: codescan.sarif
